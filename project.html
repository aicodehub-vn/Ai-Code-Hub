<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Code Hub - Project</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== NAVBAR ===== -->

    <header class="navbar">

        <div class="logo">
            AI<span>CODE</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">← Trang chủ</a>
            <a href="index.html#projects">Khám phá</a>
        </nav>

        <div class="nav-actions">

            <button
                class="upload-btn"
                type="button"
                onclick="window.location.href='upload.html'"
            >
                + Đăng code
            </button>

            <a
                href="login.html"
                class="login-btn"
            >
                Đăng nhập
            </a>

        </div>

    </header>


    <!-- ===== PROJECT PAGE ===== -->

    <main class="project-page">


        <!-- ===== PROJECT INFO ===== -->

        <section class="project-detail-header">

            <div class="project-detail-tags">

                <span
                    class="language"
                    id="projectLanguage"
                >
                    ...
                </span>

                <span
                    class="ai-model"
                    id="projectAI"
                >
                    ...
                </span>

            </div>


            <h1 id="projectTitle">
                Đang tải project...
            </h1>


            <p
                class="project-detail-description"
                id="projectDescription"
            >
                Đang lấy dữ liệu từ AI Code Hub.
            </p>


            <div class="project-meta">

                <span id="projectAuthor">
                    👤 ...
                </span>

                <span id="projectLikes">
                    ♥ 0 lượt thích
                </span>

                <span id="projectViews">
                    👁 0 lượt xem
                </span>

            </div>

        </section>


        <!-- ===== SOURCE CODE ===== -->

        <section class="source-section">

            <div class="source-header">

                <div>

                    <h2>
                        Source Code
                    </h2>

                    <p>
                        Khám phá mã nguồn của project
                    </p>

                </div>


                <button
                    id="copyCodeButton"
                    type="button"
                >
                    Copy Code
                </button>

            </div>


            <!-- ===== CODE WORKSPACE ===== -->

            <div class="code-workspace">


                <!-- ===== FILE LIST ===== -->

                <aside class="file-list">

                    <div class="file-list-title">
                        FILES
                    </div>

                </aside>


                <!-- ===== CODE VIEWER ===== -->

                <div class="code-viewer">

                    <div class="code-toolbar">

                        <span id="currentFile">
                            Đang tải...
                        </span>

                        <span>
                            Read only
                        </span>

                    </div>


                    <pre><code id="codeContent"></code></pre>

                </div>

            </div>

        </section>

    </main>


    <!-- ===== SUPABASE ===== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ===== PROJECT JAVASCRIPT ===== -->

    <script src="project.js"></script>

</body>

</html>
